name = "pea-verifier-proxy"
main = "pea-verifier-proxy-worker.js"
compatibility_date = "2025-01-01"

# ผูกฐานข้อมูล D1 สำหรับเก็บประวัติการตรวจสอบวัสดุ
# วิธีสร้าง (ทำครั้งเดียว): รัน  npx wrangler d1 create pea-verifier-db
# แล้วนำ database_id ที่ได้มาแทนที่ค่าด้านล่างนี้
[[d1_databases]]
binding = "DB"
database_name = "pea-verifier-db"
   database_id = "f4644696-4280-429c-b436-327cb459141c"